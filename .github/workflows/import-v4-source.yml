name: One-time ChipBar 4 source migration
on:
  push:
    branches:
      - release/v4.0.0-standalone-en
    paths:
      - .github/workflows/import-v4-source.yml
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Import current ChipBar application from the existing project
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch chipbar --filter=blob:none \
            https://github.com/wwwwzzzzkkkk/macmon.git "${RUNNER_TEMP}/chipbar-source"
          rsync -a "${RUNNER_TEMP}/chipbar-source/apps/ChipBar/" "./"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "chore: import ChipBar 3.6.6 app into standalone repository"
            git push origin HEAD:release/v4.0.0-standalone-en
          fi
