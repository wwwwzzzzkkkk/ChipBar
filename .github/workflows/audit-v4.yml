name: v4 localization and screenshot inventory
on:
  push:
    branches: [release/v4.0.0-standalone-en]
    paths: [.github/workflows/audit-v4.yml]
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inventory language strings and real screenshot resolutions
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib, re, struct
          for pic in ['preview.png','preview-settings.png','validation/2026-10-13/ui-soak-gaps.json.window.png']:
              p=pathlib.Path(pic)
              if p.is_file():
                  b=p.read_bytes()
                  if b.startswith(b'\\x89PNG\\r\\n\\x1a\\n'):
                      print('SCREENSHOT',pic,struct.unpack('>II',b[16:24]),'bytes',len(b))
          for file in sorted(pathlib.Path('Sources/ChipBar').glob('*.swift')):
              txt=file.read_text()
              strings = sorted(set(m.group(0) for m in re.finditer(r'"[^"\\n]*[\\u3400-\\u9fff][^"\\n]*"',txt)))
              if strings:
                  print('FILE',file.name,'CHINESE_STRINGS',len(strings))
                  for s in strings[:90]:
                      print('  ',s[:180])
          PY
