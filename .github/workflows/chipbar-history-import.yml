name: Import original ChipBar release archive

# One-time migration: reference original Git commits when accessible, otherwise explicit archive-pointer commits; always preserve exact original ZIP/SHA256 assets.
# Can be rerun safely; does not rebuild apps, modify VERSION or overwrite assets.
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/chipbar-history-import.yml
      - scripts/import_legacy_releases.py
      - scripts/import_legacy_tags.py
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: chipbar-original-release-import
  cancel-in-progress: false

jobs:
  import-tags:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Create historical tags with native GitHub refs API
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/import_legacy_tags.py

  import-releases:
    needs: import-tags
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        major: [1, 2, 3]
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6
      - name: Copy and SHA256-verify historical ChipBar Releases
        run: python3 scripts/import_legacy_releases.py --major ${{ matrix.major }}

  verify-archive:
    needs: import-releases
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6
      - name: Verify all imported assets and keep v4.0.0 as latest
        run: python3 scripts/import_legacy_releases.py --verify
